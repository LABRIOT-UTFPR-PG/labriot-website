# ==============================================================================
# Nginx Reverse Proxy para labriot.com.br na VPS Oracle OCI (Ubuntu 24.04)
# Copie para: /etc/nginx/sites-available/labriot.com.br
# Ative com:  sudo ln -s /etc/nginx/sites-available/labriot.com.br /etc/nginx/sites-enabled/
# Depois rode: sudo certbot --nginx -d labriot.com.br -d www.labriot.com.br
# ==============================================================================

# Zonas de Rate Limiting (proteção contra força bruta, spam e abuso de IA)
limit_req_zone $binary_remote_addr zone=labriot_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=labriot_contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=labriot_ai:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=labriot_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name labriot.com.br www.labriot.com.br;

    # Limite de upload (permite imagens de até 5MB em base64 na rota /api/roboflow)
    client_max_body_size 10M;

    # Oculta versão do Nginx
    server_tokens off;

    # Headers de Segurança adicionais (Certbot adicionará HTTPS + HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache longo para assets imutáveis do Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proteção reforçada para login admin
    location = /api/auth/login {
        limit_req zone=labriot_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Proteção reforçada para formulário de contato
    location = /api/contact {
        limit_req zone=labriot_contact burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Proteção reforçada para inferência de IA (Roboflow)
    location = /api/roboflow {
        limit_req zone=labriot_ai burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 30s;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Demais rotas da aplicação Next.js
    location / {
        limit_req zone=labriot_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
